server:
  port: ${PORT:8080}

spring:
  application:
    name: preporbit-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/preporbit}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

app:
  jwt:
    secret: ${JWT_SECRET:PrepOrbitSecretKeyForJwtAuthenticationTokensMustBeLongEnoughForSha256Security}
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  ai:
    provider: ${LLM_PROVIDER:gemini} # gemini, openai, or mock
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:gemini-1.5-flash}
    timeout-ms: 30000
